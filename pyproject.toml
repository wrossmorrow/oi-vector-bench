[project]
name = "oilake"
version = "0.1.0"
description = "Open Images metadata + PE-Core embeddings as a Delta lake on S3, for filtered/grouped vector-search benchmarks"
requires-python = ">=3.11"   # tomllib
dependencies = [
    "pyarrow>=15",      # FixedSizeListArray.from_arrays(mask=...), S3 filesystem
    "deltalake>=1.0",   # delta-rs writer; no Spark, no catalog
    "pandas>=2.2",      # pyarrow imports it if present; pin a numpy-2-compatible build
    "numpy>=1.26",
]

[project.optional-dependencies]
embed = [
    "torch>=2.3",
    "open_clip_torch>=2.32",  # must include the timm/PE-Core-* configs
    "timm>=1.0.16",
    "pillow>=10",
    "boto3>=1.34",
]
bench = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",    # HalfVector + psycopg type registration
    "tabulate>=0.9",    # pandas.to_markdown in reports
]
analysis = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "jinja2>=3",        # pandas Styler (colored tables)
]
dev = ["pytest>=8"]

[project.scripts]
oilake = "oilake.cli:main"
oibench = "oibench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
# Target Python version and line width
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
